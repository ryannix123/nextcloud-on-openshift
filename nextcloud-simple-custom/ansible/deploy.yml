---
# ═══════════════════════════════════════════════════════════════════════════════
# Nextcloud on OpenShift — Ansible Deployment Playbook
# Requirements: ansible-galaxy collection install kubernetes.core community.okd
# Usage:
#   ansible-playbook ansible/deploy.yml
#   ansible-playbook ansible/deploy.yml -e nextcloud_image=quay.io/me/nc:v2
#   ansible-playbook ansible/deploy.yml --tags cleanup
#   ansible-playbook ansible/deploy.yml --tags cleanup -e keep_data=true
# ═══════════════════════════════════════════════════════════════════════════════
- name: Deploy Nextcloud on OpenShift
  hosts: localhost
  connection: local
  gather_facts: false

  vars_prompt:
    - name: save_manifests_prompt
      prompt: "Save Kubernetes manifests to ./manifests/? [y/N]"
      default: "N"
      private: false

  vars:
    nextcloud_image: "quay.io/ryan_nix/nextcloud-openshift:latest"
    manifest_dir: "{{ playbook_dir }}/../manifests"
    namespace: "{{ lookup('pipe', 'oc project -q') }}"

  pre_tasks:
    - name: Set manifest saving flag
      ansible.builtin.set_fact:
        save_manifests: "{{ save_manifests_prompt | lower == 'y' }}"

    - name: Show deployment info
      ansible.builtin.debug:
        msg:
          - "Namespace : {{ namespace }}"
          - "Image     : {{ nextcloud_image }}"
          - "Save YAML : {{ save_manifests }}"

  tasks:
    # ─────────────────────────────────────────────────────────────────────────
    # Secrets — generated once, preserved on re-runs
    # ─────────────────────────────────────────────────────────────────────────
    - name: Check existing secrets
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        name: "{{ item }}"
        namespace: "{{ namespace }}"
      loop:
        - mariadb-secret
        - redis-secret
        - nextcloud-secret
      register: existing_secrets

    - name: Build map of existing secret names
      ansible.builtin.set_fact:
        existing_secret_names: >-
          {{ existing_secrets.results
             | selectattr('resources', 'defined')
             | selectattr('resources', 'ne', [])
             | map(attribute='resources')
             | flatten
             | map(attribute='metadata.name')
             | list }}

    - name: Generate passwords (only used for new secrets)
      ansible.builtin.set_fact:
        mysql_root_pw: "{{ lookup('password', '/dev/null length=20 chars=ascii_letters,digits') }}"
        mysql_pw:      "{{ lookup('password', '/dev/null length=20 chars=ascii_letters,digits') }}"
        redis_pw:      "{{ lookup('password', '/dev/null length=20 chars=ascii_letters,digits') }}"
        admin_pw:      "{{ lookup('password', '/dev/null length=20 chars=ascii_letters,digits') }}"
      no_log: true

    - name: Create mariadb-secret (skipped if exists)
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: mariadb-secret
            namespace: "{{ namespace }}"
          stringData:
            root-password: "{{ mysql_root_pw }}"
            database: nextcloud
            username: nextcloud
            password: "{{ mysql_pw }}"
      when: "'mariadb-secret' not in existing_secret_names"
      no_log: true

    - name: Preserve existing mariadb-secret
      ansible.builtin.debug:
        msg: "Secret 'mariadb-secret' already exists — preserving existing credentials"
      when: "'mariadb-secret' in existing_secret_names"

    - name: Create redis-secret (skipped if exists)
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: redis-secret
            namespace: "{{ namespace }}"
          stringData:
            password: "{{ redis_pw }}"
      when: "'redis-secret' not in existing_secret_names"
      no_log: true

    - name: Preserve existing redis-secret
      ansible.builtin.debug:
        msg: "Secret 'redis-secret' already exists — preserving existing credentials"
      when: "'redis-secret' in existing_secret_names"

    - name: Create nextcloud-secret (skipped if exists)
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Secret
          metadata:
            name: nextcloud-secret
            namespace: "{{ namespace }}"
          stringData:
            admin-user: admin
            admin-password: "{{ admin_pw }}"
      when: "'nextcloud-secret' not in existing_secret_names"
      no_log: true

    - name: Preserve existing nextcloud-secret
      ansible.builtin.debug:
        msg: "Secret 'nextcloud-secret' already exists — preserving existing credentials"
      when: "'nextcloud-secret' in existing_secret_names"

    # ─────────────────────────────────────────────────────────────────────────
    # PVCs
    # ─────────────────────────────────────────────────────────────────────────
    - name: Create PVCs
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: "{{ item.name }}"
            namespace: "{{ namespace }}"
          spec:
            accessModes: [ReadWriteOnce]
            resources:
              requests:
                storage: "{{ item.size }}"
      loop:
        - { name: mariadb-pvc,          size: 5Gi   }
        - { name: nextcloud-data-pvc,   size: 20Gi  }
        - { name: nextcloud-apps-pvc,   size: 1Gi   }
        - { name: nextcloud-config-pvc, size: 100Mi }

    # ─────────────────────────────────────────────────────────────────────────
    # MariaDB
    # ─────────────────────────────────────────────────────────────────────────
    - name: Deploy MariaDB 11.8
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: mariadb
            namespace: "{{ namespace }}"
            labels:
              app: mariadb
              app.kubernetes.io/name: mariadb
              app.kubernetes.io/part-of: nextcloud-app
              app.openshift.io/runtime: mariadb
          spec:
            replicas: 1
            strategy:
              type: Recreate
            selector:
              matchLabels:
                app: mariadb
            template:
              metadata:
                labels:
                  app: mariadb
                  app.kubernetes.io/name: mariadb
                  app.kubernetes.io/part-of: nextcloud-app
              spec:
                containers:
                  - name: mariadb
                    image: quay.io/fedora/mariadb-118
                    ports:
                      - containerPort: 3306
                    env:
                      - name: MYSQL_ROOT_PASSWORD
                        valueFrom:
                          secretKeyRef:
                            name: mariadb-secret
                            key: root-password
                      - name: MYSQL_DATABASE
                        valueFrom:
                          secretKeyRef:
                            name: mariadb-secret
                            key: database
                      - name: MYSQL_USER
                        valueFrom:
                          secretKeyRef:
                            name: mariadb-secret
                            key: username
                      - name: MYSQL_PASSWORD
                        valueFrom:
                          secretKeyRef:
                            name: mariadb-secret
                            key: password
                    volumeMounts:
                      - name: mariadb-data
                        mountPath: /var/lib/mysql/data
                    resources:
                      requests: { memory: 256Mi, cpu: 100m }
                      limits:   { memory: 1Gi,   cpu: 1000m }
                    livenessProbe:
                      exec:
                        command: ["sh", "-c", "mariadb-admin ping -u root -p${MYSQL_ROOT_PASSWORD}"]
                      initialDelaySeconds: 30
                      periodSeconds: 10
                    readinessProbe:
                      exec:
                        command: ["sh", "-c", "mariadb-admin ping -u root -p${MYSQL_ROOT_PASSWORD}"]
                      initialDelaySeconds: 5
                      periodSeconds: 5
                volumes:
                  - name: mariadb-data
                    persistentVolumeClaim:
                      claimName: mariadb-pvc

    - name: Create MariaDB Service
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Service
          metadata:
            name: mariadb
            namespace: "{{ namespace }}"
            labels:
              app: mariadb
              app.kubernetes.io/name: mariadb
              app.kubernetes.io/part-of: nextcloud-app
          spec:
            selector:
              app: mariadb
            ports:
              - port: 3306
                targetPort: 3306

    # ─────────────────────────────────────────────────────────────────────────
    # Redis
    # ─────────────────────────────────────────────────────────────────────────
    - name: Deploy Redis 8
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: redis
            namespace: "{{ namespace }}"
            labels:
              app: redis
              app.kubernetes.io/name: redis
              app.kubernetes.io/part-of: nextcloud-app
              app.openshift.io/runtime: redis
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: redis
            template:
              metadata:
                labels:
                  app: redis
                  app.kubernetes.io/name: redis
                  app.kubernetes.io/part-of: nextcloud-app
              spec:
                containers:
                  - name: redis
                    image: docker.io/redis:8-alpine
                    command:
                      - redis-server
                      - "--requirepass"
                      - "$(REDIS_PASSWORD)"
                      - "--save"
                      - ""
                      - "--appendonly"
                      - "no"
                      - "--stop-writes-on-bgsave-error"
                      - "no"
                    ports:
                      - containerPort: 6379
                    env:
                      - name: REDIS_PASSWORD
                        valueFrom:
                          secretKeyRef:
                            name: redis-secret
                            key: password
                    resources:
                      requests: { memory: 64Mi,  cpu: 50m }
                      limits:   { memory: 256Mi, cpu: 500m }
                    securityContext:
                      allowPrivilegeEscalation: false
                      runAsNonRoot: true
                      capabilities: { drop: [ALL] }
                      seccompProfile: { type: RuntimeDefault }

    - name: Create Redis Service
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Service
          metadata:
            name: redis
            namespace: "{{ namespace }}"
            labels:
              app: redis
              app.kubernetes.io/name: redis
              app.kubernetes.io/part-of: nextcloud-app
          spec:
            selector:
              app: redis
            ports:
              - port: 6379
                targetPort: 6379

    # ─────────────────────────────────────────────────────────────────────────
    # Wait for MariaDB before deploying Nextcloud
    # ─────────────────────────────────────────────────────────────────────────
    - name: Wait for MariaDB to be ready
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: Deployment
        name: mariadb
        namespace: "{{ namespace }}"
      register: mariadb_deploy
      until: >-
        mariadb_deploy.resources | length > 0 and
        (mariadb_deploy.resources[0].status.readyReplicas | default(0)) >= 1
      retries: 24
      delay: 5

    # ─────────────────────────────────────────────────────────────────────────
    # Nextcloud
    # ─────────────────────────────────────────────────────────────────────────
    - name: Deploy Nextcloud
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: nextcloud
            namespace: "{{ namespace }}"
            labels:
              app: nextcloud
              app.kubernetes.io/name: nextcloud
              app.kubernetes.io/part-of: nextcloud-app
              app.openshift.io/runtime: nginx
            annotations:
              app.openshift.io/connects-to: >-
                [{"apiVersion":"apps/v1","kind":"Deployment","name":"mariadb"},
                 {"apiVersion":"apps/v1","kind":"Deployment","name":"redis"}]
          spec:
            replicas: 1
            strategy:
              type: Recreate
            selector:
              matchLabels:
                app: nextcloud
            template:
              metadata:
                labels:
                  app: nextcloud
                  app.kubernetes.io/name: nextcloud
                  app.kubernetes.io/part-of: nextcloud-app
              spec:
                containers:
                  - name: nextcloud
                    image: "{{ nextcloud_image }}"
                    ports:
                      - containerPort: 8080
                    env:
                      - name: NC_MYSQL_HOST
                        value: mariadb
                      - name: NC_MYSQL_PORT
                        value: "3306"
                      - name: NC_MYSQL_DATABASE
                        valueFrom:
                          secretKeyRef:
                            name: mariadb-secret
                            key: database
                      - name: NC_MYSQL_USER
                        valueFrom:
                          secretKeyRef:
                            name: mariadb-secret
                            key: username
                      - name: NC_MYSQL_PASSWORD
                        valueFrom:
                          secretKeyRef:
                            name: mariadb-secret
                            key: password
                      - name: NC_REDIS_HOST
                        value: redis
                      - name: NC_REDIS_PORT
                        value: "6379"
                      - name: NC_REDIS_PASSWORD
                        valueFrom:
                          secretKeyRef:
                            name: redis-secret
                            key: password
                      - name: NEXTCLOUD_ADMIN_USER
                        valueFrom:
                          secretKeyRef:
                            name: nextcloud-secret
                            key: admin-user
                      - name: NEXTCLOUD_ADMIN_PASSWORD
                        valueFrom:
                          secretKeyRef:
                            name: nextcloud-secret
                            key: admin-password
                      - name: NEXTCLOUD_TRUSTED_DOMAINS
                        value: localhost
                      - name: NC_S3_ENABLED
                        value: "false"
                    volumeMounts:
                      - name: nextcloud-data
                        mountPath: /var/www/html/data
                      - name: nextcloud-config
                        mountPath: /var/www/html/config
                      - name: nextcloud-apps
                        mountPath: /var/www/html/custom_apps
                    resources:
                      requests: { memory: 256Mi, cpu: 100m }
                      limits:   { memory: 1Gi,   cpu: 1000m }
                    readinessProbe:
                      httpGet:
                        path: /status.php
                        port: 8080
                        httpHeaders:
                          - name: Host
                            value: localhost
                      initialDelaySeconds: 60
                      periodSeconds: 10
                      timeoutSeconds: 5
                      failureThreshold: 30
                    securityContext:
                      allowPrivilegeEscalation: false
                      runAsNonRoot: true
                      capabilities: { drop: [ALL] }
                      seccompProfile: { type: RuntimeDefault }
                volumes:
                  - name: nextcloud-data
                    persistentVolumeClaim:
                      claimName: nextcloud-data-pvc
                  - name: nextcloud-config
                    persistentVolumeClaim:
                      claimName: nextcloud-config-pvc
                  - name: nextcloud-apps
                    persistentVolumeClaim:
                      claimName: nextcloud-apps-pvc

    - name: Create Nextcloud Service
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: v1
          kind: Service
          metadata:
            name: nextcloud
            namespace: "{{ namespace }}"
            labels:
              app: nextcloud
              app.kubernetes.io/name: nextcloud
              app.kubernetes.io/part-of: nextcloud-app
          spec:
            selector:
              app: nextcloud
            ports:
              - port: 8080
                targetPort: 8080

    - name: Create Nextcloud Route
      kubernetes.core.k8s:
        state: present
        definition:
          apiVersion: route.openshift.io/v1
          kind: Route
          metadata:
            name: nextcloud
            namespace: "{{ namespace }}"
            annotations:
              haproxy.router.openshift.io/timeout: 3600s
          spec:
            to:
              kind: Service
              name: nextcloud
            port:
              targetPort: 8080
            tls:
              termination: edge
              insecureEdgeTerminationPolicy: Redirect

    # ─────────────────────────────────────────────────────────────────────────
    # Patch NEXTCLOUD_TRUSTED_DOMAINS with actual route hostname.
    # entrypoint.sh uses the first trusted domain to configure WOPI URLs —
    # it must be the real external hostname, not localhost.
    # ─────────────────────────────────────────────────────────────────────────
    - name: Get route hostname
      kubernetes.core.k8s_info:
        api_version: route.openshift.io/v1
        kind: Route
        name: nextcloud
        namespace: "{{ namespace }}"
      register: nextcloud_route

    - name: Set route hostname fact
      ansible.builtin.set_fact:
        route_host: "{{ nextcloud_route.resources[0].spec.host }}"

    - name: Patch NEXTCLOUD_TRUSTED_DOMAINS with route hostname
      kubernetes.core.k8s:
        state: patched
        api_version: apps/v1
        kind: Deployment
        name: nextcloud
        namespace: "{{ namespace }}"
        definition:
          spec:
            template:
              spec:
                containers:
                  - name: nextcloud
                    env:
                      - name: NEXTCLOUD_TRUSTED_DOMAINS
                        value: "{{ route_host }}"

    - name: Wait for Nextcloud to be ready
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: Deployment
        name: nextcloud
        namespace: "{{ namespace }}"
      register: nc_deploy
      until: >-
        nc_deploy.resources | length > 0 and
        (nc_deploy.resources[0].status.readyReplicas | default(0)) >= 1
      retries: 60
      delay: 10

    # ─────────────────────────────────────────────────────────────────────────
    # Optional: save manifests to ./manifests/
    # ─────────────────────────────────────────────────────────────────────────
    - name: Create manifests directory
      ansible.builtin.file:
        path: "{{ manifest_dir }}"
        state: directory
        mode: '0755'
      when: save_manifests | bool

    - name: Export deployment manifests
      ansible.builtin.shell: |
        oc get deployment {{ item }} -n {{ namespace }} -o yaml \
          | grep -v 'resourceVersion\|uid:\|creationTimestamp\|generation:\|kubectl.kubernetes.io' \
          > {{ manifest_dir }}/deployment-{{ item }}.yaml
      loop: [mariadb, redis, nextcloud]
      when: save_manifests | bool

    - name: Export service manifests
      ansible.builtin.shell: |
        oc get service {{ item }} -n {{ namespace }} -o yaml \
          | grep -v 'resourceVersion\|uid:\|creationTimestamp\|kubectl.kubernetes.io' \
          > {{ manifest_dir }}/service-{{ item }}.yaml
      loop: [mariadb, redis, nextcloud]
      when: save_manifests | bool

    - name: Export PVC manifests
      ansible.builtin.shell: |
        oc get pvc {{ item }} -n {{ namespace }} -o yaml \
          | grep -v 'resourceVersion\|uid:\|creationTimestamp\|kubectl.kubernetes.io\|volumeName\|pv.kubernetes.io' \
          > {{ manifest_dir }}/pvc-{{ item }}.yaml
      loop: [mariadb-pvc, nextcloud-data-pvc, nextcloud-apps-pvc, nextcloud-config-pvc]
      when: save_manifests | bool

    - name: Export route manifest
      ansible.builtin.shell: |
        oc get route nextcloud -n {{ namespace }} -o yaml \
          | grep -v 'resourceVersion\|uid:\|creationTimestamp\|kubectl.kubernetes.io\|openshift.io/host.generated' \
          > {{ manifest_dir }}/route-nextcloud.yaml
      when: save_manifests | bool

    - name: Manifests saved
      ansible.builtin.debug:
        msg: "✓ Manifests saved to {{ manifest_dir }}/ (secrets excluded — regenerated at deploy time)"
      when: save_manifests | bool

    # ─────────────────────────────────────────────────────────────────────────
    # Verify Collabora CODE server
    # WOPI URL config is owned by entrypoint.sh — do not override it here.
    # ─────────────────────────────────────────────────────────────────────────
    - name: Wait for CODE server to initialize
      ansible.builtin.pause:
        seconds: 60
        prompt: "Waiting 60s for Collabora CODE server to initialize..."

    - name: Get Nextcloud pod name
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Pod
        namespace: "{{ namespace }}"
        label_selectors:
          - app=nextcloud
      register: nc_pods

    - name: Set pod name fact
      ansible.builtin.set_fact:
        nc_pod: "{{ nc_pods.resources[0].metadata.name }}"

    - name: Verify Nextcloud Office
      kubernetes.core.k8s_exec:
        namespace: "{{ namespace }}"
        pod: "{{ nc_pod }}"
        command: php /var/www/html/occ richdocuments:activate-config
      register: office_check
      ignore_errors: true

    - name: Nextcloud Office status
      ansible.builtin.debug:
        msg: >-
          {{ '✓ Nextcloud Office verified and ready!'
             if office_check.rc == 0
             else 'CODE server still initializing — document editing available in 1-2 minutes' }}

    # ─────────────────────────────────────────────────────────────────────────
    # Display credentials
    # ─────────────────────────────────────────────────────────────────────────
    - name: Get admin password from secret
      kubernetes.core.k8s_info:
        api_version: v1
        kind: Secret
        name: nextcloud-secret
        namespace: "{{ namespace }}"
      register: nc_secret
      no_log: true

    - name: Decode admin password
      ansible.builtin.set_fact:
        admin_password_decoded: "{{ nc_secret.resources[0].data['admin-password'] | b64decode }}"
      no_log: true

    - name: Deployment complete
      ansible.builtin.debug:
        msg:
          - "═══════════════════════════════════════════════════════════════"
          - "  ✓ Nextcloud Deployment Complete!"
          - "═══════════════════════════════════════════════════════════════"
          - "  URL      : https://{{ route_host }}"
          - "  Username : admin"
          - "  Password : {{ admin_password_decoded }}"
          - "═══════════════════════════════════════════════════════════════"
          - "  Save these credentials — they won't be shown again!"
          - "═══════════════════════════════════════════════════════════════"


# ═══════════════════════════════════════════════════════════════════════════════
# Cleanup play
# ansible-playbook ansible/deploy.yml --tags cleanup
# ansible-playbook ansible/deploy.yml --tags cleanup -e keep_data=true
# ═══════════════════════════════════════════════════════════════════════════════
- name: Cleanup Nextcloud deployment
  hosts: localhost
  connection: local
  gather_facts: false
  tags: [cleanup, never]

  vars:
    keep_data: false
    namespace: "{{ lookup('pipe', 'oc project -q') }}"

  tasks:
    - name: Confirm full cleanup
      ansible.builtin.pause:
        prompt: >-
          This will delete ALL Nextcloud resources{{ ' including PVCs' if not keep_data | bool else ' (PVCs preserved)' }}.
          Press Enter to continue or Ctrl+C to abort

    - name: Delete deployments, services, route, and secrets
      kubernetes.core.k8s:
        state: absent
        api_version: "{{ item.api }}"
        kind: "{{ item.kind }}"
        name: "{{ item.name }}"
        namespace: "{{ namespace }}"
      loop:
        - { api: apps/v1,                kind: Deployment, name: nextcloud       }
        - { api: apps/v1,                kind: Deployment, name: mariadb         }
        - { api: apps/v1,                kind: Deployment, name: redis           }
        - { api: v1,                     kind: Service,    name: nextcloud       }
        - { api: v1,                     kind: Service,    name: mariadb         }
        - { api: v1,                     kind: Service,    name: redis           }
        - { api: route.openshift.io/v1,  kind: Route,      name: nextcloud       }
        - { api: v1,                     kind: Secret,     name: nextcloud-secret }
        - { api: v1,                     kind: Secret,     name: mariadb-secret   }
        - { api: v1,                     kind: Secret,     name: redis-secret     }
      ignore_errors: true

    - name: Delete PVCs
      kubernetes.core.k8s:
        state: absent
        api_version: v1
        kind: PersistentVolumeClaim
        name: "{{ item }}"
        namespace: "{{ namespace }}"
      loop:
        - mariadb-pvc
        - nextcloud-data-pvc
        - nextcloud-apps-pvc
        - nextcloud-config-pvc
      when: not keep_data | bool
      ignore_errors: true

    - name: Cleanup complete
      ansible.builtin.debug:
        msg: "✓ Cleanup complete{{ ' — PVCs preserved' if keep_data | bool else ' — all data removed' }}"
