# ═══════════════════════════════════════════════════════════════════════════════
# Nextcloud Container Build Pipeline
# Builds with Podman and pushes to Quay.io
# ═══════════════════════════════════════════════════════════════════════════════
#
# Required GitHub Secrets:
#   QUAY_USERNAME - Quay.io robot account (format: username+robotname)
#   QUAY_PASSWORD - Quay.io robot token
#
# Usage:
#   - Manual:    Actions → Build and Push Nextcloud → Run workflow
#                  gh workflow run "Build and Push Nextcloud" -R ryannix123/nextcloud-on-openshift
#                Always builds. This is the button for "a CVE just dropped".
#   - Daily:     6am UTC — builds only if a new Nextcloud release is out
#   - Weekly:    Mondays — ALWAYS rebuilds, even if Nextcloud hasn't changed.
#                The image's attack surface is mostly PHP, nginx and the CentOS
#                base, and none of those bump the Nextcloud version when they
#                ship a fix.
#   - On push:   Always builds when Containerfile or configs change on main
#   - On tag:    Push a vX.Y.Z tag to build and publish a versioned release
#                git tag -a v2.0.0 -m "CentOS Stream 10, PHP 8.5, Collabora fix"
#                git push origin v2.0.0
#
# Every build runs with --pull=always --no-cache, so dnf fetches current
# packages instead of reusing a layer holding last month's PHP.
#
# Tags: <nextcloud-version>, <nextcloud-version>-<YYYYMMDD>, latest (+ release
# tag). The dated tag is immutable, so a security rebuild never destroys the
# previous image you might want to roll back to.
# ═══════════════════════════════════════════════════════════════════════════════

name: Build and Push Nextcloud

on:
  # Manual trigger with version input
  workflow_dispatch:
    inputs:
      nextcloud_version:
        description: 'Nextcloud version to build (leave empty for latest)'
        required: false
        default: ''

  schedule:
    - cron: '0 6 * * *'    # Daily at 6am UTC: build only on a new Nextcloud release
    - cron: '30 7 * * 1'   # Weekly, Monday 7:30 UTC: forced rebuild for OS/PHP fixes

  # Build on push to main when container-related files change
  push:
    branches: [ main ]
    paths:
      - 'nextcloud-simple-custom/Containerfile'
      - 'nextcloud-simple-custom/nginx.conf'
      - 'nextcloud-simple-custom/supervisord.conf'
      - 'nextcloud-simple-custom/entrypoint.sh'
      - '.github/workflows/build-nextcloud.yml'

    # Release tags — pushing vX.Y.Z triggers a build that also tags the image
    # with the release version (e.g. quay.io/ryan_nix/nextcloud-openshift:v2.0.0)
    tags:
      - 'v*'

env:
  REGISTRY: quay.io
  IMAGE_NAME: ryan_nix/nextcloud-openshift
  BUILD_CONTEXT: ./nextcloud-simple-custom

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # Required to create GitHub Releases

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # ─────────────────────────────────────────────────────────────────────────
    # Determine which Nextcloud version to build
    # ─────────────────────────────────────────────────────────────────────────
    - name: Determine Nextcloud version
      id: version
      run: |
        if [ -n "${{ inputs.nextcloud_version }}" ]; then
          VERSION="${{ inputs.nextcloud_version }}"
          echo "Using manually specified version: ${VERSION}"
        else
          echo "Fetching latest Nextcloud version..."
          VERSION=$(curl -sL https://download.nextcloud.com/server/releases/ | \
                    grep -oP 'nextcloud-\K[0-9]+\.[0-9]+\.[0-9]+(?=\.tar\.bz2")' | \
                    sort -V | tail -1)
          if [ -z "${VERSION}" ]; then
            echo "::error::Failed to determine latest Nextcloud version"
            exit 1
          fi
          echo "Latest stable version: ${VERSION}"
        fi

        echo "version=${VERSION}" >> $GITHUB_OUTPUT
        echo "date=$(date -u +%Y%m%d)" >> $GITHUB_OUTPUT

        # If this is a release tag push, capture the tag (e.g. v2.0.0)
        if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
          RELEASE_TAG="${{ github.ref_name }}"
          echo "release_tag=${RELEASE_TAG}" >> $GITHUB_OUTPUT
          echo "is_release=true" >> $GITHUB_OUTPUT
          echo "### 🏷️ Release ${RELEASE_TAG} — Nextcloud ${VERSION}" >> $GITHUB_STEP_SUMMARY
        else
          echo "is_release=false" >> $GITHUB_OUTPUT
          echo "### 🏷️ Building Nextcloud ${VERSION}" >> $GITHUB_STEP_SUMMARY
        fi

    # ─────────────────────────────────────────────────────────────────────────
    # Decide whether to build.
    #
    # Only the DAILY schedule may skip, and only when this Nextcloud version is
    # already published. Everything else always builds -- including pushes,
    # which previously skipped whenever the version tag existed, so a
    # Containerfile or entrypoint fix never reached the registry.
    # ─────────────────────────────────────────────────────────────────────────
    - name: Decide whether to build
      id: check
      run: |
        EVENT="${{ github.event_name }}"
        SCHEDULE="${{ github.event.schedule }}"

        if [ "$EVENT" = "schedule" ] && [ "$SCHEDULE" = "0 6 * * *" ]; then
          if podman manifest inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }} > /dev/null 2>&1; then
            echo "Image tag ${{ steps.version.outputs.version }} already exists — daily check skips"
            echo "build=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          echo "New Nextcloud release ${{ steps.version.outputs.version }} — building"
        elif [ "$EVENT" = "schedule" ]; then
          echo "🛡️ Weekly security refresh — rebuilding from scratch"
          echo "### 🛡️ Weekly security refresh" >> $GITHUB_STEP_SUMMARY
        else
          echo "🔨 Event '${EVENT}' — always building"
        fi
        echo "build=true" >> $GITHUB_OUTPUT

    # ─────────────────────────────────────────────────────────────────────────
    # Build the container image
    # ─────────────────────────────────────────────────────────────────────────
    - name: Build with Podman
      if: steps.check.outputs.build == 'true'
      working-directory: ./nextcloud-simple-custom
      run: |
        echo "Building Nextcloud ${{ steps.version.outputs.version }}..."

        # Version tag, immutable dated tag, and latest.
        # On a release tag, also tag the image with the release version (e.g. v2.0.0).
        TAGS="-t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }} \
              -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}-${{ steps.version.outputs.date }} \
              -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"

        if [ "${{ steps.version.outputs.is_release }}" = "true" ]; then
          TAGS="${TAGS} -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.release_tag }}"
          echo "Release build — also tagging as ${{ steps.version.outputs.release_tag }}"
        fi

        # --pull=always: never build on a stale CentOS base.
        # --no-cache: always re-run dnf so OS and PHP fixes actually land.
        podman build \
          --pull=always \
          --no-cache \
          --build-arg NEXTCLOUD_VERSION=${{ steps.version.outputs.version }} \
          --label org.opencontainers.image.revision=${{ github.sha }} \
          $TAGS \
          -f Containerfile \
          .

        echo "### ✅ Build completed successfully" >> $GITHUB_STEP_SUMMARY
        echo "- Nextcloud: \`${{ steps.version.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
        if [ "${{ steps.version.outputs.is_release }}" = "true" ]; then
          echo "- Release tag: \`${{ steps.version.outputs.release_tag }}\`" >> $GITHUB_STEP_SUMMARY
        fi

    # Report what PHP actually shipped. The Containerfile's guard already
    # failed the build on an unpatched PHP; this makes the answer visible in
    # the run summary without pulling anything.
    - name: Report shipped PHP version
      if: steps.check.outputs.build == 'true'
      run: |
        PHP_VER=$(podman run --rm --entrypoint php \
          ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }} \
          -r 'echo PHP_VERSION;')
        echo "✓ Image ships PHP ${PHP_VER}"
        echo "- PHP: \`${PHP_VER}\`" >> $GITHUB_STEP_SUMMARY

    # ─────────────────────────────────────────────────────────────────────────
    # Push to Quay.io
    # ─────────────────────────────────────────────────────────────────────────
    - name: Log in to Quay.io
      if: steps.check.outputs.build == 'true'
      run: |
        podman login \
          --username ${{ secrets.QUAY_USERNAME }} \
          --password ${{ secrets.QUAY_PASSWORD }} \
          ${{ env.REGISTRY }}

    - name: Push to Quay.io
      if: steps.check.outputs.build == 'true'
      run: |
        echo "Pushing images to Quay.io..."

        podman push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
        podman push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}-${{ steps.version.outputs.date }}
        podman push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

        if [ "${{ steps.version.outputs.is_release }}" = "true" ]; then
          podman push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.release_tag }}
        fi

        echo "### 🚀 Push completed" >> $GITHUB_STEP_SUMMARY
        echo "- Nextcloud version tag: \`${{ steps.version.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
        echo "- Dated tag: \`${{ steps.version.outputs.version }}-${{ steps.version.outputs.date }}\`" >> $GITHUB_STEP_SUMMARY
        if [ "${{ steps.version.outputs.is_release }}" = "true" ]; then
          echo "- Release tag: \`${{ steps.version.outputs.release_tag }}\`" >> $GITHUB_STEP_SUMMARY
        fi
        echo "- Latest tag: \`latest\`" >> $GITHUB_STEP_SUMMARY
        echo "- Registry: [quay.io/${{ env.IMAGE_NAME }}](https://${{ env.REGISTRY }}/repository/${{ env.IMAGE_NAME }})" >> $GITHUB_STEP_SUMMARY

    # ─────────────────────────────────────────────────────────────────────────
    # Create GitHub Release with notes when triggered by a tag push
    # ─────────────────────────────────────────────────────────────────────────
    - name: Create GitHub Release
      if: steps.version.outputs.is_release == 'true'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.version.outputs.release_tag }}
        name: "${{ steps.version.outputs.release_tag }} — Nextcloud ${{ steps.version.outputs.version }}"
        body: |
          ## Nextcloud on OpenShift ${{ steps.version.outputs.release_tag }}

          **Nextcloud version:** ${{ steps.version.outputs.version }}
          **Base image:** CentOS Stream 10
          **PHP:** 8.5 (Remi repository)
          **Includes:** Collabora CODE (Nextcloud Office), MariaDB 11.8, Redis 8

          ### Container Image
          ```
          quay.io/ryan_nix/nextcloud-openshift:${{ steps.version.outputs.release_tag }}
          quay.io/ryan_nix/nextcloud-openshift:${{ steps.version.outputs.version }}
          quay.io/ryan_nix/nextcloud-openshift:latest
          ```

          ### Deploy
          ```bash
          git clone https://github.com/ryannix123/nextcloud-on-openshift.git
          cd nextcloud-on-openshift/nextcloud-simple-custom
          sh deploy.sh
          ```
        generate_release_notes: true

    # ─────────────────────────────────────────────────────────────────────────
    # Summary for skipped builds
    # ─────────────────────────────────────────────────────────────────────────
    - name: Skip summary
      if: steps.check.outputs.build != 'true'
      run: |
        echo "### ⏭️ Build skipped" >> $GITHUB_STEP_SUMMARY
        echo "Image \`${{ steps.version.outputs.version }}\` already exists in registry." >> $GITHUB_STEP_SUMMARY
        echo "The weekly refresh rebuilds it anyway; use manual dispatch to force one now." >> $GITHUB_STEP_SUMMARY
