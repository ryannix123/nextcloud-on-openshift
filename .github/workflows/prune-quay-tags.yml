# ═══════════════════════════════════════════════════════════════════════════════
# Prune old image tags from Quay.io
# ═══════════════════════════════════════════════════════════════════════════════
#
# Deletes DATED build tags (<version>-YYYYMMDD) older than RETENTION_DAYS.
# Everything else is kept:
#   - latest
#   - plain version tags (35.0.2, 8.4.1) -- upgrade paths and pins depend on them
#   - release tags (v3.0.0)
#   - the KEEP_NEWEST most recent dated tags, however old, so a stretch of
#     failed builds (a Remi outage, say) can never leave nothing to roll back to
# Quay keeps a deleted tag recoverable for its time-machine window, so a
# mistaken delete can be restored from the repository's tag history.
#
# Required secret:
#   QUAY_API_TOKEN - OAuth access token from a Quay application in the
#                    ryan_nix namespace, with "Create/Update/Delete repositories"
#                    (repo:write) permission. Robot accounts can push and pull
#                    but cannot call the tag-delete API. Without the secret this
#                    workflow reports what it would delete and changes nothing.
#
# Usage:
#   - Daily at 9:15 UTC, after the builds have run.
#   - Manual: Actions → Prune old Quay tags → Run workflow. Dry run is the
#     default for manual runs; untick it to delete for real.
# ═══════════════════════════════════════════════════════════════════════════════

name: Prune old Quay tags

on:
  schedule:
    - cron: '15 9 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only list what would be deleted'
        type: boolean
        default: true

env:
  QUAY_REPO: ryan_nix/nextcloud-openshift
  RETENTION_DAYS: '14'
  KEEP_NEWEST: '2'

permissions:
  contents: read

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Prune dated tags older than ${{ env.RETENTION_DAYS }} days
        env:
          QUAY_API_TOKEN: ${{ secrets.QUAY_API_TOKEN }}
          # Scheduled runs delete for real; manual runs follow the checkbox.
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        shell: python3 {0}
        run: |
          import json, os, re, sys, time, urllib.request, urllib.parse

          repo   = os.environ["QUAY_REPO"]
          days   = int(os.environ["RETENTION_DAYS"])
          keep   = int(os.environ["KEEP_NEWEST"])
          token  = os.environ.get("QUAY_API_TOKEN", "")
          dry    = os.environ["DRY_RUN"] == "true" or not token
          api    = f"https://quay.io/api/v1/repository/{repo}/tag/"
          dated  = re.compile(r"^.+-\d{8}$")
          cutoff = time.time() - days * 86400
          summary = open(os.environ["GITHUB_STEP_SUMMARY"], "a")

          if not token:
              print("::warning::QUAY_API_TOKEN is not set: reporting only, nothing will be deleted")

          def call(url, method="GET"):
              req = urllib.request.Request(url, method=method)
              if token:
                  req.add_header("Authorization", f"Bearer {token}")
              with urllib.request.urlopen(req, timeout=30) as r:
                  return json.load(r) if method == "GET" else r.status

          # Page through the active tags.
          tags, page = [], 1
          while True:
              data = call(f"{api}?onlyActiveTags=true&limit=100&page={page}")
              tags += data.get("tags", [])
              if not data.get("has_additional"):
                  break
              page += 1

          candidates = sorted((t for t in tags if dated.match(t["name"])),
                              key=lambda t: t["start_ts"], reverse=True)
          protected  = {t["name"] for t in candidates[:keep]}
          doomed     = [t for t in candidates[keep:] if t["start_ts"] < cutoff]

          mode = "DRY RUN — nothing deleted" if dry else "deleting"
          print(f"{repo}: {len(tags)} tags, {len(candidates)} dated, "
                f"{len(doomed)} older than {days} days ({mode})")
          summary.write(f"### Quay tag pruning: `{repo}` ({mode})\n\n")
          summary.write(f"- Active tags: {len(tags)}\n- Dated tags: {len(candidates)}\n")
          summary.write(f"- Always kept (newest dated): {', '.join(sorted(protected)) or 'none'}\n")
          summary.write(f"- Older than {days} days: {len(doomed)}\n\n")

          failed = 0
          for t in doomed:
              age = int((time.time() - t["start_ts"]) / 86400)
              line = f"{t['name']}  ({age} days old)"
              if dry:
                  print(f"would delete {line}")
                  summary.write(f"- would delete `{t['name']}` ({age} days)\n")
                  continue
              try:
                  call(api + urllib.parse.quote(t["name"], safe=""), method="DELETE")
                  print(f"deleted {line}")
                  summary.write(f"- deleted `{t['name']}` ({age} days)\n")
              except Exception as e:
                  failed += 1
                  print(f"::error::could not delete {t['name']}: {e}")

          if not doomed:
              summary.write("Nothing to prune.\n")
          sys.exit(1 if failed else 0)
